<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Number Recognition</title>

<style>
body
{
    font-family: sans-serif;
    text-align: center;
    font-size: 30px;
    margin: 0;
    overflow: hidden;
    touch-action: none;
}

h2
{
    font-size: 48px;
}

#grid
{
    display:grid;
    width:95vw;
    height:95vw;
    max-width:600px;
    max-height:600px;
    margin:auto;
    grid-template-columns:repeat(12,1fr);
    touch-action: none;
}

.cell
{
    border:1px solid #cccccc;
    aspect-ratio:1;
    background:white;
    box-sizing:border-box;
}

.filled
{
    background:black;
}

button
{
    font-size: 48px;
    padding: 15px 30px;
    margin: 10px;
}

#result
{
    margin-top:20px;
    text-align:center;
    font-size:48px;
}
</style>
</head>

<body>

<h2>数字認識</h2>

<div id="grid"></div>

<br>

<button onclick="recognize()">認識</button>
<button onclick="clearGrid()">消去</button>

<div id="result">?</div>

<br>

<a href="../index.html">HOME</a>

<script>

const SIZE = 12;

let drawing = false;

let network = null;

let cells = [];

const grid = document.getElementById("grid");

grid.addEventListener("touchstart", handleTouch);

grid.addEventListener("touchmove", handleTouch);

for(let y = 0; y < SIZE; y++)
{
    cells[y] = [];

    for(let x = 0; x < SIZE; x++)
    {
        cells[y][x] = 0;

        const div = document.createElement("div");

        div.className = "cell";

        div.dataset.x = x;
        div.dataset.y = y;

        div.addEventListener(
            "mousedown",
            () =>
            {
                drawing = true;
                fillCell(div);
            });

        div.addEventListener(
            "mouseenter",
            () =>
            {
                if(drawing)
                {
                    fillCell(div);
                }
            });

        grid.appendChild(div);
    }
}

document.addEventListener("mouseup", () => drawing = false);

function fillCell(div)
{
    const x = Number(div.dataset.x);
    const y = Number(div.dataset.y);

    cells[y][x] = 1;

    div.classList.add("filled");
}

function handleTouch(event)
{
    event.preventDefault();

    const touch = event.touches[0];

    const element = document.elementFromPoint(
            touch.clientX,
            touch.clientY);

    if(element &&
       element.classList.contains("cell"))
    {
        fillCell(element);
    }
}

function clearGrid()
{
    for(let y = 0; y < SIZE; y++)
    {
        for(let x = 0; x < SIZE; x++)
        {
            cells[y][x] = 0;
        }
    }

    document
    .querySelectorAll(".cell")
    .forEach(
        c => c.classList.remove("filled"));
}

function sigmoid(x)
{
    return 1.0 /
        (1.0 + Math.exp(-x));
}

async function loadNetwork()
{
    const response =
        await fetch("weights.json");

    network =
        await response.json();

    console.log("Network loaded");
}

function recognize()
{
    if(network == null)
    {
        alert("Network not loaded");
        return;
    }

    const input = [];

    for(let y = 0; y < 12; y++)
    {
        for(let x = 0; x < 12; x++)
        {
            input.push(cells[y][x]);
        }
    }

    const hidden =
        new Array(30);

    const output =
        new Array(10);

    for(let h = 0; h < 30; h++)
    {
        let sum =
            network.HiddenBiases[h];

        for(let i = 0; i < 144; i++)
        {
            sum +=
                input[i]
                *
                network.WeightsInputHidden[i][h];
        }

        hidden[h] =
            sigmoid(sum);
    }

    for(let o = 0; o < 10; o++)
    {
        let sum =
            network.OutputBiases[o];

        for(let h = 0; h < 30; h++)
        {
            sum +=
                hidden[h]
                *
                network.WeightsHiddenOutput[h][o];
        }

        output[o] =
            sigmoid(sum);
    }

    let best = 0;

    for(let o = 1; o < 10; o++)
    {
        if(output[o] > output[best])
        {
            best = o;
        }
    }

    document
        .getElementById("result")
        .innerText = "認識結果 : " + best;
}

loadNetwork();

</script>

</body>
</html>
